name: hardwaretech-dev
services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d/main.conf:/etc/nginx/conf.d/main.conf:ro
      - ./conf.d/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - hardwaretech-network
    command: sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  hardwaretech-network:
    driver: bridge
    name: hardwaretech-network
    external: true
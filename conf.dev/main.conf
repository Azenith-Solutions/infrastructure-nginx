server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log debug;

  # ── Catálogo (site institucional) ──────────────────────────
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://frontend_catalog;
  }

  # ── Manager (sistema de gerenciamento) ─────────────────────
  location = /manager {
    return 301 /manager/;
  }

  location /manager/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://frontend_manager_system/manager/;
  }

  # ── Mobile App (versão web) ────────────────────────────────
  location = /app {
    return 301 /app/;
  }

  location /app/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://frontend_mobile_app/;
  }

  # ── Backend API ────────────────────────────────────────────
  location /api/v2/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://backend_api/api/v2/;
  }

  # ── AI Chatbot Service ─────────────────────────────────────
  location /ai/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://ai_chatbot/;
  }

  # ── Health check ───────────────────────────────────────────
  location /nginx-health {
    access_log off;
    return 200 "nginx ok\n";
    add_header Content-Type text/plain;
  }
}
